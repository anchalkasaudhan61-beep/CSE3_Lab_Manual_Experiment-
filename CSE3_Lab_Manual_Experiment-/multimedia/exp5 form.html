<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>
<body>

<h2 style="text-align:center;">Student Registration Form</h2>
<hr>

<form>
  Full Name: <input type="text" placeholder="Enter your full name"><br><br>
  
  Email: <input type="email" placeholder="Enter valid email address"><br><br>
  
  Password: <input type="password" placeholder="Enter password"><br><br>
  
  Gender: 
  <input type="radio" name="gender"> Male
  <input type="radio" name="gender"> Female
  <input type="radio" name="gender"> Other<br><br>
  
  Course: 
  <select>
    <option>-- Select Course --</option>
    <option>B.Tech</option>
    <option>BCA</option>
    <option>MCA</option>
  </select><br><br>
  
  Contact No: <input type="text" placeholder="Enter phone number"><br><br>
  
  Address:<br>
  <textarea rows="4" cols="30" placeholder="Enter your address"></textarea><br><br>
  
  <button type="submit">Register</button>
  <button type="reset">Clear</button>
</form>

<hr>
<p style="text-align:center; font-size:12px;">© 2026 Student Registration Portal</p>

</body>
</html>
