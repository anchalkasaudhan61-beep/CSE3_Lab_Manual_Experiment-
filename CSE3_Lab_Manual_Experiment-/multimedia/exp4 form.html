<!DOCTYPE html>
<html>
<head>
<title>Hotel Room Booking Form</title>
<style>
  
</style>
</head>
<body>

<div class="form-box">
  <h2>Hotel Room Booking Form</h2>

  <form>
    <label>Full Name:</label>
    <input type="text" name="fullname"><br>

    <label>Email:</label>
    <input type="email" name="email"><br>

    <label>Phone:</label>
    <input type="tel" name="phone"><br>

    <label>Check-in Date:</label>
    <input type="date" name="checkin"><br>

    <label>Check-out Date:</label>
    <input type="date" name="checkout"><br>

    <label>Room Type:</label>
    <select name="roomtype">
      <option>Single Room</option>
      <option>Double Room</option>
      <option>Deluxe Room</option>
      <option>Suite</option>
    </select><br>

    <label>Number of Guests:</label>
    <input type="number" name="guests" style="width: 70px;"><br>

    <label>Special Requests:</label><br>
    <textarea name="requests"></textarea><br>

    <button type="submit">Book Now</button>
    <button type="reset">Reset Form</button>
  </form>
</div>

</body>
</html>
